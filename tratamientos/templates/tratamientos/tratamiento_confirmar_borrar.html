{% extends "base.html" %}
{% block titulo %}Borrar tratamiento - Velaris{% endblock %}
{% block contenido %}
  <section class="card treatment-page-card treatment-confirm-card">
    <div class="card-body">
      <h1 class="treatment-page-title">Borrar {{ tratamiento.nombre_tratamiento }}?</h1>
      <p>¿Estás seguro de que querés borrar este tratamiento?</p>
      <form method="post">
        {% csrf_token %}
        <div class="treatment-page-actions">
          <button type="submit" class="btn btn-danger">Sí, borrar</button>
          <a href="{% url 'tratamiento_lista' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
