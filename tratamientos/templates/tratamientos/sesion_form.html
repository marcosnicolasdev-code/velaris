{% extends "base.html" %}
{% block titulo %}Sesión - Velaris{% endblock %}
{% block contenido %}
  <section class="form-surface">
    <h1 class="treatment-page-title">{% if form.instance.pk %}Editar sesión{% else %}Nueva sesión{% endif %}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="treatment-page-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'sesion_lista' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
