{% extends "base.html" %}
{% block titulo %}Borrar — Velaris{% endblock %}
{% block contenido %}
    <section class="card management-page-card management-confirm-card">
        <div class="card-body">
            <h1 class="management-page-title">¿Borrar este producto?</h1>
            <p>{{ producto.codigo_producto }} — {{ producto.nombre_producto }}</p>
            <form method="post">
                {% csrf_token %}
                <div class="management-page-actions">
                    <button type="submit" class="btn btn-danger">Sí, borrar</button>
                    <a href="{% url 'producto_lista' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
{% endblock %}
