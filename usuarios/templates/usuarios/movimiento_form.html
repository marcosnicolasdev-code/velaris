{% extends "base.html" %}

{% block titulo %}Registrar movimiento — Velaris{% endblock %}

{% block contenido %}
  <section class="form-surface">
    <h1 class="management-page-title">Registrar movimiento</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="management-page-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'caja_movimientos' %}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
