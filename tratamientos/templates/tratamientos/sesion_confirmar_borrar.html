{% extends "base.html" %}
{% block titulo %}Borrar sesión - Velaris{% endblock %}
{% block contenido %}
  <section class="card treatment-page-card treatment-confirm-card">
    <div class="card-body">
      <h1 class="treatment-page-title">Borrar sesión {{ sesion.id_sesion }}?</h1>
      <p>¿Estás seguro de que querés borrar esta sesión?</p>
      <form method="post">
        {% csrf_token %}
        <div class="treatment-page-actions">
          <button type="submit" class="btn btn-danger">Sí, borrar</button>
          <a href="{% url 'sesion_lista' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
