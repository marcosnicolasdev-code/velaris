{% extends "base.html" %}

{% block titulo %}Nueva evolución{% endblock %}

{% block contenido %}
  <section class="form-surface">
    <h1 class="management-page-title">Nueva evolución</h1>
    <p class="patient-context">
      Paciente:
      <strong>{{ paciente.apellido_paciente }}, {{ paciente.nombre_paciente }}</strong>
    </p>

    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label for="descripcion">Descripción</label>
        <textarea
          name="descripcion"
          id="descripcion"
          class="form-control"
          rows="5"
        ></textarea>
      </div>

      <div class="management-page-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'paciente_detalle' paciente.dni %}" class="btn btn-secondary">
          Cancelar
        </a>
      </div>
    </form>
  </section>
{% endblock %}
