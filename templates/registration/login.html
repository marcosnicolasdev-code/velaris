{% extends "base.html" %}

{% block titulo %}Iniciar Sesion - Velaris{% endblock %}

{% block contenido %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Iniciar Sesion</h3>

                {% if form.errors %}
                    <div class="alert alert-danger" role="alert">
                        Usuario o contrasenia incorrectos.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Usuario</label>
                        <input type="text" name="username" autofocus maxlength="254" class="form-control" required id="id_username">
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required id="id_password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-3">Ingresar</button>
                    <input type="hidden" name="next" value="{{ next }}">
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
