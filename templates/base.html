{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Velaris{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/velaris.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark header-bar">
      <div class="container-fluid">
      <!-- Logo de Velaris -->
      <a class="navbar-brand" href="{% url 'inicio' %}">
        <img src="{% static 'css/img/logoVelarisSup.png' %}" alt="Logo" height= "60">
      </a>
      <!-- Barra buscador pacientes -->
      {% if user.is_authenticated %}
<form class="d-flex mx-auto" method="get" action="#" role="search" style="width: 40%;">          <input class="form-control me-2" type="search" name="dni" placeholder="Buscar paciente por DNI..."aria-label="Search">
          <button class="btn btn-light" type="submit">Buscar</button>
        </form>
      <!-- Usuario + cerrar sesión --> 
      <div class="d-flex align-items-center text-white">
        <span class="me-3">{{ user.get_full_name | default:user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container my-4">
    {% block contenido %}{% endblock %}
  </main>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
