{% extends "base.html" %}

{% block titulo %}Borrar caja — Velaris{% endblock %}

{% block contenido %}
  <section class="card management-page-card management-confirm-card">
    <div class="card-body">
      <h1 class="management-page-title">¿Estás seguro de borrar esta caja?</h1>
      <p>Caja #{{ caja.id }} — total ${{ caja.total_caja }}</p>
      <form method="post">
        {% csrf_token %}
        <div class="management-page-actions">
          <button type="submit" class="btn btn-danger">Eliminar</button>
          <a href="{% url 'caja_lista' %}" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </section>
{% endblock %}
